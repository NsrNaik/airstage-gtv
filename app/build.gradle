plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.airplaytv'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.airplaytv'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '3.1'
        ndk {
            // Cheap Google TV sticks often run a 32-bit userland on a 64-bit CPU.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Release signing: keystore.properties (git-ignored, never committed) points to the key. Without
    // it, release builds are signed with the debug key so anyone can still build and install.
    def keystoreFile = rootProject.file('keystore.properties')
    signingConfigs {
        if (keystoreFile.exists()) {
            def props = new Properties()
            keystoreFile.withInputStream { props.load(it) }
            release {
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
    implementation 'androidx.palette:palette:1.0.0'
}
